name: Claude version bump

# Raises the app version on a pull request for its author (CODING_STANDARDS.md
# §9), so nobody has to remember. Claude runs only when the shared check says
# the raise is missing: a PR that already raised it costs one shell step, and
# Claude's own commit re-triggers this workflow, finds the version raised and
# stops there.
#
# When the base branch moves past the PR's version (another PR merged first),
# "Update branch" is a new push, so this runs again and raises from the new base.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop, 'release/**']

concurrency:
  group: claude-version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    # Forks get no secrets and no write access; their author raises it by hand.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Is the version already raised?
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if bash .github/scripts/check-version-bump.sh "$BASE_SHA"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise it
        if: steps.check.outputs.needed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Commits through GitHub's API, so they are signed and pass the
          # signed-commits rule on main. The commit tool this adds
          # (mcp__github_file_ops__commit_files) must also be in --allowedTools
          # below: with an explicit prompt the action does not allow it itself.
          use_commit_signing: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            BASE: ${{ github.event.pull_request.base.ref }} at ${{ github.event.pull_request.base.sha }}

            This pull request changes shipped code but does not raise the app
            version above its base branch. Raise it, following
            CODING_STANDARDS.md §9 and CLAUDE.md exactly. The PR branch is
            checked out.

            1. Read the base version: `git show ${{ github.event.pull_request.base.sha }}:app/pubspec.yaml`.
            2. Decide the change type from `git diff ${{ github.event.pull_request.base.sha }}...HEAD`
               and the PR title: breaking → MAJOR, new feature or behaviour a
               patient can notice → MINOR, anything else (fix, refactor,
               dependency bump, copy) → PATCH. One raise, sized by the largest
               change in the PR.
            3. Set `version:` in app/pubspec.yaml to the BASE version raised by
               that type, with the base build number + 1. Always compute from
               the base, never from the PR's current value.
            4. In CHANGELOG.md, open a NEW section `## [<new name>] - Unreleased`
               directly above the base branch's top section. Never rename or
               edit the existing sections' headings. Move the lines this PR
               added (compare CHANGELOG.md with the base) out of the older
               sections into the new one, under the same group headings
               (Added / Changed / Fixed / Removed / Security, only those used).
               If the PR added no line, write one, as §9 asks: what changed and
               why it matters to a patient.
            5. Run `bash .github/scripts/check-version-bump.sh ${{ github.event.pull_request.base.sha }}`
               and make sure it passes.
            6. Commit only app/pubspec.yaml and CHANGELOG.md, with the message
               `[Version] Raise to <new version>`. Change nothing else.
            7. Post one short PR comment: old → new version and the one-line
               reason for the type you chose.
          claude_args: |
            --allowedTools "Read,Edit,mcp__github_file_ops__commit_files,Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git status:*),Bash(bash .github/scripts/check-version-bump.sh:*),Bash(gh pr comment:*),Bash(gh pr view:*)"
