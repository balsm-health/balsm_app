name: Release

# Every release lands on the repo's Releases page.
#
# A tag is a channel release:
#   v1.2.0-alpha.N → alpha (staging backend, Firebase alpha-testers)
#   v1.2.0-beta.N  → beta  (staging backend, Firebase beta-testers)
#   v1.2.0         → production (prod backend, Firebase production, web deploy)
# The version in the tag must be the one in app/pubspec.yaml at that commit,
# and a production tag must sit on a commit QA already had as an alpha or
# beta. Anything else fails before it builds. Tags are normally made by the
# Promote workflow (promote.yml), which checks the same and then starts this
# workflow on the tag; see docs/releasing.md.
#
# A branch push builds that commit for every platform, to prove it still
# builds:
#   main        → prod backend
#   release/**  → staging backend
# It uploads no artifacts, makes no GitHub Release, sends nothing to Firebase
# testers and deploys nothing: a branch push starts on its own, and only a
# release someone on the team starts (Promote, or a tag pushed by hand)
# uploads anything.
#
# Release tags also upload to App Store Connect (TestFlight), Google Play and
# Huawei AppGallery, without submitting anything for review: see the store
# jobs at the end and docs/releasing.md → Store uploads.
#
# Signing + Firebase steps are guarded on secrets — absent secrets skip the
# step and still upload an unsigned artifact. See docs/ci-secrets.md.
on:
  # How Promote starts a release: a tag it creates with GITHUB_TOKEN starts no
  # workflow, but a dispatch does. Only a tag is accepted (see setup).
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    # The tags branch pushes create are made with GITHUB_TOKEN, which starts no
    # workflow; the exclusions keep it that way if a person pushes one by hand.
    tags: ['v*', '!v*-main.*', '!v*-rc.*']

# Two pushes to one branch: the newer release replaces the build in flight.
# Tags each get their own run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

# Builds go through the balsm CLI (bin/balsm → tool/build.dart), the single
# source of truth for flavor/entrypoint/dart-define wiring. Only channel
# naming, signing, and artifact zipping live here.
env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  setup:
    name: Derive channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.d.outputs.channel }}
      env_file: ${{ steps.d.outputs.env_file }}
      firebase_group: ${{ steps.d.outputs.firebase_group }}
      build_name: ${{ steps.d.outputs.build_name }}
      prerelease: ${{ steps.d.outputs.prerelease }}
      tag: ${{ steps.d.outputs.tag }}
      distribute: ${{ steps.d.outputs.distribute }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/pubspec.yaml
          sparse-checkout-cone-mode: false
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PUBSPEC_NAME=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          [ -n "$PUBSPEC_NAME" ] || { echo "::error::no version in app/pubspec.yaml"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run this on a release tag, not a branch. To release a commit, use the Promote workflow."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="${GITHUB_REF_NAME}"
            # Exact shapes only: a typo such as v1.2.0-alpa must not fall
            # through to a production release.
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta)\.[0-9]+$ ]]; then
              BUILD_NAME="${BASH_REMATCH[1]}"; CH="${BASH_REMATCH[2]}"
              ENVF=staging; GRP="${CH}-testers"; PRE=true
            elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              BUILD_NAME="${BASH_REMATCH[1]}"; CH=production
              ENVF=prod; GRP=production; PRE=false
            else
              echo "::error::$TAG is not a release tag: use v1.2.0-alpha.N, v1.2.0-beta.N or v1.2.0."
              exit 1
            fi
            if [ "$BUILD_NAME" != "$PUBSPEC_NAME" ]; then
              echo "::error::$TAG says $BUILD_NAME but app/pubspec.yaml at this commit is $PUBSPEC_NAME."
              exit 1
            fi
            # Production ships only what testers already had: the same
            # commit must carry an alpha or beta tag of the same version
            # whose release finished. A tag alone is not enough, since a
            # failed build leaves its tag behind; the GitHub Release is made
            # only once every build of that tag succeeded.
            if [ "$CH" = production ]; then
              QA=$(git ls-remote --tags origin "v${BUILD_NAME}-alpha.*" "v${BUILD_NAME}-beta.*" \
                | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' | sort -u)
              TESTED=""
              for q in $QA; do
                gh release view "$q" -R "$GITHUB_REPOSITORY" --json isDraft -q 'select(.isDraft | not) | 1' 2>/dev/null | grep -q 1 \
                  && TESTED="$TESTED $q"
              done
              if [ -z "$TESTED" ]; then
                echo "::error::$TAG is on a commit with no finished alpha or beta release${QA:+ (tagged $(echo $QA), but none released)}. Release it to testers first."
                exit 1
              fi
              echo "Tested as:$TESTED"
            fi
            DIST=true
          else
            # `version: 0.1.0+9` → 0.1.0. The run number, not the pubspec build
            # number, keeps the tag unique: a doc-only push does not raise it.
            BUILD_NAME="$PUBSPEC_NAME"
            case "$GITHUB_REF_NAME" in
              main) CH=main; ENVF=prod;    SUFFIX=main ;;
              *)    CH=rc;   ENVF=staging; SUFFIX=rc ;;
            esac
            TAG="v${BUILD_NAME}-${SUFFIX}.${{ github.run_number }}"
            GRP=""; PRE=true; DIST=false
          fi
          echo "channel=$CH"            >> "$GITHUB_OUTPUT"
          echo "env_file=$ENVF"         >> "$GITHUB_OUTPUT"
          echo "firebase_group=$GRP"    >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"        >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "distribute=$DIST"       >> "$GITHUB_OUTPUT"
          echo "Channel=$CH env=$ENVF tag=$TAG build_name=$BUILD_NAME build_number=${{ github.run_number }}"

  android:
    name: Android APK (${{ needs.setup.outputs.channel }})
    needs: setup
    runs-on: ubuntu-latest
    # Read by the store jobs: they upload only a build signed with the upload
    # key, never one Gradle signed with the debug key.
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_APP_ID_ANDROID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      # app/env/shared.json is git-ignored (per-developer server list); the CLI
      # refuses to build without one. SHARED_ENV_JSON (real DSN + servers) wins;
      # the tracked template is the fallback. See docs/ci-secrets.md.
      - name: Provision server list (env/shared.json)
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      - name: Provision release keystore
        if: env.HAS_ANDROID_SIGNING == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - id: signed
        run: echo "signed=$HAS_ANDROID_SIGNING" >> "$GITHUB_OUTPUT"
      - name: Build APK
        run: |
          ./bin/balsm apk balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/*.apk "dist/balsm-${{ needs.setup.outputs.channel }}.apk"
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/balsm-${{ needs.setup.outputs.channel }}.apk
          if-no-files-found: error
      # The app bundle Google Play takes (the store jobs at the end). Release
      # tags only, and only signed: Play refuses a debug-signed bundle, and
      # `balsm aab ... prod` refuses to build one. --no-apk: the APK above is
      # already the same build.
      - name: Build AAB (Google Play)
        if: github.ref_type == 'tag' && env.HAS_ANDROID_SIGNING == 'true'
        run: |
          ./bin/balsm aab balsm ${{ needs.setup.outputs.env_file }} --no-apk \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          find app/build/app/outputs/bundle -name '*.aab' -exec cp {} "dist/balsm-${{ needs.setup.outputs.channel }}.aab" \;
      - if: github.ref_type == 'tag' && env.HAS_ANDROID_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: dist/balsm-${{ needs.setup.outputs.channel }}.aab
          if-no-files-found: error
      - name: Firebase App Distribution
        if: env.HAS_FIREBASE == 'true' && needs.setup.outputs.distribute == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ needs.setup.outputs.firebase_group }}
          file: dist/balsm-${{ needs.setup.outputs.channel }}.apk
          releaseNotes: "Balsm ${{ needs.setup.outputs.tag }} (build ${{ github.run_number }})"

  ios:
    name: iOS IPA (${{ needs.setup.outputs.channel }})
    needs: setup
    runs-on: macos-latest
    env:
      HAS_IOS_SIGNING: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_PROVISIONING_PROFILE != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_APP_ID_IOS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      # app/env/shared.json is git-ignored (per-developer server list); the CLI
      # refuses to build without one. SHARED_ENV_JSON (real DSN + servers) wins;
      # the tracked template is the fallback. See docs/ci-secrets.md.
      - name: Provision server list (env/shared.json)
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      - name: Import signing certificate
        if: env.HAS_IOS_SIGNING == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Install provisioning profile
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/balsm.mobileprovision
      # `balsm ipa` exports with ios/signing/adhoc.plist; overwrite the tracked
      # template with the secret-configured one for this runner only.
      - name: Write export options (ios/signing/adhoc.plist)
        if: env.HAS_IOS_SIGNING == 'true'
        working-directory: app/ios/signing
        run: |
          cat > adhoc.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
      - name: Build IPA (signed)
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          ./bin/balsm ipa balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          cp app/build/ios/ipa/*.ipa "dist/balsm-${{ needs.setup.outputs.channel }}.ipa"
      - name: Build iOS (unsigned fallback)
        if: env.HAS_IOS_SIGNING != 'true'
        run: |
          ./bin/balsm ipa-archive balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          (cd app/build/ios/archive/Runner.xcarchive/Products/Applications && zip -r "$GITHUB_WORKSPACE/dist/balsm-${{ needs.setup.outputs.channel }}-ios-unsigned.zip" Runner.app)
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/*
          if-no-files-found: error
      - name: Firebase App Distribution
        if: env.HAS_FIREBASE == 'true' && env.HAS_IOS_SIGNING == 'true' && needs.setup.outputs.distribute == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ needs.setup.outputs.firebase_group }}
          file: dist/balsm-${{ needs.setup.outputs.channel }}.ipa
          releaseNotes: "Balsm ${{ needs.setup.outputs.tag }} (build ${{ github.run_number }})"

  macos:
    name: macOS
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      # app/env/shared.json is git-ignored (per-developer server list); the CLI
      # refuses to build without one. SHARED_ENV_JSON (real DSN + servers) wins;
      # the tracked template is the fallback. See docs/ci-secrets.md.
      - name: Provision server list (env/shared.json)
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      - name: Scaffold macOS platform (generated on runner, not committed)
        working-directory: app
        run: flutter config --enable-macos-desktop && flutter create --platforms=macos .
      - name: Build macOS
        run: |
          ./bin/balsm macos balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          (cd app/build/macos/Build/Products/Release && zip -r "$GITHUB_WORKSPACE/dist/balsm-${{ needs.setup.outputs.channel }}-macos.zip" *.app)
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows
    needs: setup
    # Not windows-latest: its Visual Studio 2026 toolchain rejects the
    # <experimental/coroutine> header permission_handler_windows still uses
    # (STL1011). Move on once the plugin drops it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        shell: bash
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      # shared.json is git-ignored; secret wins, tracked template is the fallback.
      - name: Provision server list (env/shared.json)
        shell: bash
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      - name: Scaffold Windows platform (generated on runner, not committed)
        working-directory: app
        shell: bash
        run: flutter config --enable-windows-desktop && flutter create --platforms=windows .
      - name: Build Windows
        shell: bash
        run: |
          ./bin/balsm windows balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          (cd app/build/windows/x64/runner/Release && 7z a "$GITHUB_WORKSPACE/dist/balsm-${{ needs.setup.outputs.channel }}-windows.zip" ./*)
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libsecret-1-dev libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      # app/env/shared.json is git-ignored (per-developer server list); the CLI
      # refuses to build without one. SHARED_ENV_JSON (real DSN + servers) wins;
      # the tracked template is the fallback. See docs/ci-secrets.md.
      - name: Provision server list (env/shared.json)
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      - name: Scaffold Linux platform (generated on runner, not committed)
        working-directory: app
        run: flutter config --enable-linux-desktop && flutter create --platforms=linux .
      - name: Build Linux
        run: |
          ./bin/balsm linux balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          tar -C app/build/linux/x64/release/bundle -czf "dist/balsm-${{ needs.setup.outputs.channel }}-linux.tar.gz" .
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.tar.gz
          if-no-files-found: error

  web:
    name: Web
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      # app/env/shared.json is git-ignored (per-developer server list); the CLI
      # refuses to build without one. SHARED_ENV_JSON (real DSN + servers) wins;
      # the tracked template is the fallback. See docs/ci-secrets.md.
      - name: Provision server list (env/shared.json)
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      - name: Build Web
        run: |
          # The CLI adds --base-href/--no-web-resources-cdn itself for prod;
          # alpha/beta (staging) deploy to the same path, so pass them through.
          EXTRA=""
          if [ "${{ needs.setup.outputs.env_file }}" != "prod" ]; then
            EXTRA="--base-href=/apps/balsm/ --no-web-resources-cdn"
          fi
          ./bin/balsm web balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }} $EXTRA
          mkdir -p dist
          (cd app/build/web && zip -r "$GITHUB_WORKSPACE/dist/balsm-${{ needs.setup.outputs.channel }}-web.zip" .)
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [setup, android, ios, macos, windows, linux, web]
    # Tags only: branch builds upload nothing to attach.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -R assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Balsm ${{ needs.setup.outputs.tag }}
          prerelease: ${{ needs.setup.outputs.prerelease }}
          generate_release_notes: true
          files: assets/**/*
          fail_on_unmatched_files: true

  # app.balsm.health — the web app, the app-update manifests and the
  # release-notes page (deploy/web/). Production tags only: alpha and beta
  # build against staging and must not replace the live site.
  #
  # Runs after the GitHub Release, so the site moves with the release rather
  # than ahead of a build that failed. Guarded on the Cloudflare token like
  # the signing steps: absent, the job is skipped and the release still passes.
  deploy-web:
    name: Deploy web (app.balsm.health)
    needs: [setup, github-release]
    if: needs.setup.outputs.channel == 'production'
    runs-on: ubuntu-latest
    # A named environment, so required reviewers can be added in
    # Repo → Settings → Environments without touching this file.
    environment:
      name: web-production
      url: https://app.balsm.health
    # Two production tags in a row: finish the first deploy, then run the next.
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set — web deploy skipped. See docs/ci-secrets.md."
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: '22'
      # The Worker prints text from a file onto a page that shares an origin
      # with the web app; its escaping and headers are tested, not assumed.
      - name: Test the Worker
        if: env.HAS_CLOUDFLARE == 'true'
        run: node --test deploy/web/worker.test.mjs
      - uses: subosito/flutter-action@v2
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        if: env.HAS_CLOUDFLARE == 'true'
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      - name: Provision server list (env/shared.json)
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      # Its own build, not the `web` job's artifact: that one is built for
      # https://balsm.health/apps/balsm (the CLI sets --base-href=/apps/balsm/
      # for prod), and this site is served from the domain root. The later
      # --base-href wins.
      - name: Build web for the domain root
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          ./bin/balsm web balsm prod \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }} \
            --base-href=/
      # A build with the wrong base path, or without the files iOS, Android and
      # installed apps fetch, would take the site or deep links down. Refuse
      # to deploy it.
      - name: Check the build before it goes live
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          set -e
          cd app/build/web
          grep -q '<base href="/">' index.html || { echo "::error::index.html is not built for the domain root"; exit 1; }
          test -s main.dart.js
          for f in .well-known/apple-app-site-association .well-known/assetlinks.json version/balsm.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "::error::$f is missing or not JSON"; exit 1; }
          done
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy -c deploy/web/wrangler.jsonc
      # The deploy "succeeding" is not the site working. Ask it.
      - name: Smoke-check the live site
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          set -e
          sleep 10
          check() { # url, expected content-type prefix
            got=$(curl -fsS -o /dev/null -w '%{content_type}' --retry 5 --retry-delay 5 "$1")
            case "$got" in "$2"*) echo "ok   $1 ($got)";; *) echo "::error::$1 answered '$got', expected $2"; exit 1;; esac
          }
          check https://app.balsm.health/ text/html
          check https://app.balsm.health/version/balsm.json application/json
          check "https://app.balsm.health/whats-new?brand=balsm" text/html
          curl -fsS --retry 5 --retry-delay 5 https://app.balsm.health/.well-known/apple-app-site-association | python3 -c "import json,sys; json.load(sys.stdin); print('ok   apple-app-site-association')"

  # ── Store uploads ────────────────────────────────────────────────────────
  # Release tags only (alpha, beta, production), and only once the GitHub
  # Release exists, i.e. every build of the tag succeeded. Nothing here submits
  # for store review or starts a rollout: TestFlight gets a build, Play gets a
  # release (a draft for production), AppGallery gets a package on the version
  # being edited. A person finishes each in its console (docs/releasing.md).
  #
  # Store signing is production: every store job runs in the
  # release-production environment, which holds the store secrets and waits
  # for one of its reviewers before each upload, alpha and beta included. The
  # reviewer sees the finished builds before they reach a store; a production
  # tag pushed by hand (which Promote never saw) waits the same way. A job
  # whose secrets are missing warns and passes, so a fork or an unconfigured
  # repo still releases.

  # iOS → App Store Connect (TestFlight), every channel. Its own build: the
  # `ios` job exports an ad-hoc IPA (for Firebase) with the repo's ad-hoc
  # profile, and App Store Connect takes only an App Store-signed one, whose
  # profile and secrets live in the release-production environment.
  #
  # Uploaded with `xcrun altool --upload-app` and an App Store Connect API key:
  # it ships with Xcode on the runner, so no Ruby or fastlane toolchain.
  # (notarytool is for notarising Mac software outside the store and cannot
  # deliver to App Store Connect.)
  testflight:
    name: App Store Connect / TestFlight (${{ needs.setup.outputs.channel }})
    needs: [setup, github-release]
    if: >-
      always() && github.ref_type == 'tag' && needs.setup.outputs.distribute == 'true'
      && needs.github-release.result == 'success'
    runs-on: macos-latest
    environment: release-production
    permissions:
      contents: read
    concurrency:
      group: store-ios
      cancel-in-progress: false
    env:
      HAS_TESTFLIGHT: >-
        ${{ secrets.APPLE_DIST_CERT_P12 != '' && secrets.APPLE_DIST_CERT_PASSWORD != ''
        && secrets.APPSTORE_PROVISIONING_PROFILE != '' && secrets.APPLE_TEAM_ID != ''
        && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_PRIVATE_KEY != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_TESTFLIGHT != 'true'
        run: echo "::warning::the iOS store secrets in release-production are not all set — TestFlight upload skipped. See docs/ci-secrets.md."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_TESTFLIGHT == 'true'
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        if: env.HAS_TESTFLIGHT == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate drift code (core)
        if: env.HAS_TESTFLIGHT == 'true'
        run: (cd packages/core && flutter pub get && dart run build_runner build)
      - name: Provision server list (env/shared.json)
        if: env.HAS_TESTFLIGHT == 'true'
        env:
          SHARED_ENV_JSON: ${{ secrets.SHARED_ENV_JSON }}
        run: |
          if [ -n "$SHARED_ENV_JSON" ]; then
            printf '%s' "$SHARED_ENV_JSON" > app/env/shared.json
          else
            cp app/env/shared.example.json app/env/shared.json
          fi
      # A keychain of its own, deleted at the end, so the distribution key
      # never sits in the login keychain of a shared runner image.
      - name: Import the distribution certificate (temporary keychain)
        if: env.HAS_TESTFLIGHT == 'true'
        env:
          P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/store-signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASSWORD"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASSWORD" "$KEYCHAIN" > /dev/null
          # Keep the runner's own keychains in the search list, after ours.
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Install the App Store provisioning profile
        if: env.HAS_TESTFLIGHT == 'true'
        env:
          PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          # Xcode 16+ reads the second folder, older Xcode the first.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/appstore.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      # `balsm ipa-appstore` exports with ios/signing/appstore.plist; overwrite
      # the tracked template for this runner only.
      - name: Write export options (ios/signing/appstore.plist)
        if: env.HAS_TESTFLIGHT == 'true'
        working-directory: app/ios/signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > appstore.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>app.balsm.health</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
      - name: Build IPA (App Store)
        if: env.HAS_TESTFLIGHT == 'true'
        run: |
          ./bin/balsm ipa-appstore balsm ${{ needs.setup.outputs.env_file }} \
            --build-name=${{ needs.setup.outputs.build_name }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          cp app/build/ios/ipa/*.ipa "dist/balsm-${{ needs.setup.outputs.channel }}-appstore.ipa"
      # altool finds the key as AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys.
      # Uploads only: the build appears in TestFlight after processing, and
      # nothing is submitted for App Store review.
      - name: Upload to App Store Connect (TestFlight)
        if: env.HAS_TESTFLIGHT == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          (umask 077; printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE")
          xcrun altool --upload-app --type ios \
            --file "dist/balsm-${{ needs.setup.outputs.channel }}-appstore.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} (${{ needs.setup.outputs.tag }}) to App Store Connect. Not submitted for review." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always() && env.HAS_TESTFLIGHT == 'true'
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf ~/.appstoreconnect/private_keys
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

  # Android → Google Play, the signed app bundle from the `android` job.
  #   alpha      → internal testing   (completed)
  #   beta       → closed testing "alpha" track (completed)
  #   production → production, as a DRAFT release: a person sets the rollout
  #                and sends it for review in Play Console.
  google-play:
    name: Google Play (${{ needs.setup.outputs.channel }})
    needs: [setup, android, github-release]
    if: >-
      always() && github.ref_type == 'tag' && needs.setup.outputs.distribute == 'true'
      && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: read
    concurrency:
      group: store-android
      cancel-in-progress: false
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      SIGNED: ${{ needs.android.outputs.signed }}
    steps:
      - name: Skip notice
        if: env.HAS_PLAY != 'true' || env.SIGNED != 'true'
        run: |
          if [ "$HAS_PLAY" != true ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set in release-production — Google Play upload skipped. See docs/ci-secrets.md."
          else
            echo "::warning::No signed app bundle (ANDROID_KEYSTORE_BASE64 is not set) — Google Play upload skipped. See docs/ci-secrets.md."
          fi
      - name: Pick the track
        id: track
        if: env.HAS_PLAY == 'true' && env.SIGNED == 'true'
        run: |
          case "${{ needs.setup.outputs.channel }}" in
            alpha)      echo "track=internal"   >> "$GITHUB_OUTPUT"; echo "status=completed" >> "$GITHUB_OUTPUT" ;;
            beta)       echo "track=alpha"      >> "$GITHUB_OUTPUT"; echo "status=completed" >> "$GITHUB_OUTPUT" ;;
            production) echo "track=production" >> "$GITHUB_OUTPUT"; echo "status=draft"     >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::no Play track for channel ${{ needs.setup.outputs.channel }}"; exit 1 ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.HAS_PLAY == 'true' && env.SIGNED == 'true'
        with:
          name: android-aab
          path: dist
      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true' && env.SIGNED == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.balsm.health
          releaseFiles: dist/balsm-${{ needs.setup.outputs.channel }}.aab
          releaseName: ${{ needs.setup.outputs.tag }} (${{ github.run_number }})
          track: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.status }}
      - name: Summary
        if: env.HAS_PLAY == 'true' && env.SIGNED == 'true'
        run: echo "Uploaded ${{ needs.setup.outputs.tag }} to Google Play track **${{ steps.track.outputs.track }}** (status ${{ steps.track.outputs.status }})." >> "$GITHUB_STEP_SUMMARY"

  # Android → Huawei AppGallery, the signed APK from the `android` job
  # (tool/appgallery_upload.sh). The package lands on the version being edited
  # in AppGallery Connect and is never submitted for review. The app depends
  # on Google services that phones without GMS lack; see docs/releasing.md.
  appgallery:
    name: Huawei AppGallery (${{ needs.setup.outputs.channel }})
    needs: [setup, android, github-release]
    if: >-
      always() && github.ref_type == 'tag' && needs.setup.outputs.distribute == 'true'
      && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: read
    concurrency:
      group: store-huawei
      cancel-in-progress: false
    env:
      HAS_HUAWEI: ${{ secrets.HUAWEI_CLIENT_ID != '' && secrets.HUAWEI_CLIENT_SECRET != '' && secrets.HUAWEI_APP_ID != '' }}
      SIGNED: ${{ needs.android.outputs.signed }}
    steps:
      - name: Skip notice
        if: env.HAS_HUAWEI != 'true' || env.SIGNED != 'true'
        run: |
          if [ "$HAS_HUAWEI" != true ]; then
            echo "::warning::HUAWEI_CLIENT_ID / HUAWEI_CLIENT_SECRET / HUAWEI_APP_ID are not all set in release-production — AppGallery upload skipped. See docs/ci-secrets.md."
          else
            echo "::warning::No signed APK (ANDROID_KEYSTORE_BASE64 is not set) — AppGallery upload skipped. See docs/ci-secrets.md."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_HUAWEI == 'true' && env.SIGNED == 'true'
        with:
          sparse-checkout: tool/appgallery_upload.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.HAS_HUAWEI == 'true' && env.SIGNED == 'true'
        with:
          name: android-apk
          path: dist
      - name: Upload to AppGallery Connect (not submitted)
        if: env.HAS_HUAWEI == 'true' && env.SIGNED == 'true'
        env:
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        run: |
          bash tool/appgallery_upload.sh --file "dist/balsm-${{ needs.setup.outputs.channel }}.apk"
          echo "Uploaded ${{ needs.setup.outputs.tag }} to AppGallery Connect. Not submitted for review." >> "$GITHUB_STEP_SUMMARY"
