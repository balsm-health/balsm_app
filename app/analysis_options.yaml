include: package:balsm_lints/analysis_options.yaml

analyzer:
  exclude:
    # i69n-generated bundles — getters mirror the snake_case JSON keys, which
    # trips non_constant_identifier_names. Generated, never hand-edited.
    - lib/**/*.i69n.dart
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**

formatter:
  page_width: 120
