name: app
description: Balsm runnable shell
publish_to: none
version: 0.8.0+29
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  account:
    path: ../modules/account
  app_links: ^7.2.2
  auth:
    path: ../modules/auth
  balsm_api:
    path: ../packages/balsm_api
  # slices() / splitBetween() — Dart team package, already in the tree
  # transitively. Declared directly so it can be imported.
  collection: ^1.19.0
  core:
    path: ../packages/core
  # Font for CupertinoIcons, which cupertino_ui (Flutter 3.47 split) references.
  # Without it the icon tree-shaker warns and those glyphs render as boxes.
  cupertino_icons: ^2.0.0
  deletion:
    path: ../modules/deletion
  device_info_plus: ^13.3.0
  dio: ^5.8.0
  disclosure:
    path: ../modules/disclosure
  emergency_card:
    path: ../modules/emergency_card
  family:
    path: ../modules/family
  family_link:
    path: ../modules/family_link
  file_picker: ^13.4.1  # Marker clustering for the care map — the directory holds ~19k places, so
  # plotting them unclustered is unusable and janks the frame budget.
  fluster: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.0.10+1
  gal: ^3.0.1
  geofence_block:
    path: ../modules/geofence_block
  geolocator: ^13.0.4
  go_router: ^18.1.4  # Typed i18n codegen (same fork as core) — app-shell strings live in
  # balsm_app/i18n/*.i69n.json, generated via build_runner.
  i69n:
    git:
      url: https://github.com/balsm-health/i69n
      ref: master
  image_picker: ^1.1.2
  latlong2: ^0.10.1
  lucide_icons_flutter: ^4.0.3
  marionette_flutter: ^0.7.0
  material_ui: ^1.2.0
  medications:
    path: ../modules/medications
  mobile_scanner: ^7.4.2
  pasteboard: ^0.6.2  # Exact-artwork hit testing on the body map (see widgets/body_hit_map.dart).
  # Both are already in the tree via flutter_svg; declared because we import them.
  path_parsing: ^1.1.0
  path_provider: ^2.1.5
  pdfrx: ^3.1.0
  pregnancy:
    path: ../modules/pregnancy
  prescriptions:
    path: ../modules/prescriptions
  profile:
    path: ../modules/profile
  qr_flutter: ^4.1.0
  records:
    path: ../modules/records
  riverpod: any
  self_report:
    path: ../modules/self_report
  sensors_plus: ^7.1.0
  sessions:
    path: ../modules/sessions
  share_plus: ^13.3.1
  url_launcher: ^6.3.0
  url_strategy: ^0.3.0
  vaccinations:
    path: ../modules/vaccinations
  xml: ^6.6.1
dev_dependencies:
  balsm_lints:
    path: ../packages/balsm_lints
  build_runner: ^2.4.13
  # Test-only: care_repository_test opens an in-memory AppDatabase.
  drift: ^2.31.0
  flutter_test:
    sdk: flutter
  # Test-only: device_location_test fakes the platform's location answers.
  geolocator_platform_interface: ^4.2.8
  # Used by repo-root test/ suites (golden, phi_leak_fuzz) run via the app package.
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  patrol: ^4.9.0
  plugin_platform_interface: ^2.1.8
  # Test-only: analytics_consent_toggle_test seeds the KV store via
  # SharedPreferences.setMockInitialValues.
  shared_preferences: ^2.3.0
  vm_service: ^15.3.0
  yaml: ^3.1.2
  # Test-only: the monkey e2e stubs external launches (tel:, mailto:, links) so a random tap cannot leave the app.
  url_launcher_platform_interface: ^2.3.2
dependency_overrides:
  # path_provider_foundation 2.6.0 migrated to package:objective_c + the
  # experimental native-assets build, which mislinks on iOS (Foundation not
  # linked → "Couldn't resolve OBJC_CLASS_$_NSArray ... symbol not found").
  # Pin to the last method-channel build to sidestep native assets.
  path_provider_foundation: 2.4.1
# The on-device database is SQLCipher on every platform. package:sqlite3's
# build hook downloads its prebuilt, sha256-pinned SQLCipher build for each
# target (libsqlcipher.so per Android ABI, libsqlcipher.dylib for iOS device /
# simulator) and bundles it as a native asset (DynamicLoadingBundled): the Dart
# runtime dlopens that file and resolves sqlite3_* on its handle, so no global
# symbol publication is needed (the Android failure behind `source: process`).
# History: `source: system` + `name_android: sqlcipher` resolved to Apple's
# plain libsqlite3.dylib on iOS, so the iOS DB was never encrypted; core's
# `PRAGMA cipher_version` guard now refuses to open such a database.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/body/
    - assets/brand/
  # Self-hosted brand type, copied from the design system's own `fonts/`.
  # The DS ships these deliberately: "offline-default is value #1 … nothing in
  # the type stack touches the network at runtime". Fetching them from Google
  # at runtime (the previous `google_fonts` setup) broke that promise — a
  # signal-less pharmacy fell back to system glyphs. All SIL OFL 1.1.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-VariableFont_wdth_wght.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

# Patrol native-automation config. app_name is the label Patrol uses when it
# drives the app; the ids must match the Android applicationId and the iOS
# bundle id (both app.balsm.health), NOT the gradle namespace.
patrol:
  app_name: Balsm
  android:
    package_name: app.balsm.health
  ios:
    bundle_id: app.balsm.health
