name: app
description: Balsm runnable shell
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core:
    path: ../packages/core
  balsm_api:
    path: ../packages/balsm_api
  auth:
    path: ../modules/auth
  disclosure:
    path: ../modules/disclosure
  profile:
    path: ../modules/profile
  emergency_card:
    path: ../modules/emergency_card
  medications:
    path: ../modules/medications
  self_report:
    path: ../modules/self_report
  records:
    path: ../modules/records
  appointments:
    path: ../modules/appointments
  prescriptions:
    path: ../modules/prescriptions
  sessions:
    path: ../modules/sessions
  account:
    path: ../modules/account
  deletion:
    path: ../modules/deletion
  geofence_block:
    path: ../modules/geofence_block
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  app_links: ^6.3.0
  url_strategy: ^0.3.0
  lucide_icons: ^0.257.0
  # Typed i18n codegen (same fork as core) — app-shell strings live in
  # balsm_app/i18n/*.i69n.json, generated via build_runner.
  i69n:
    git:
      url: https://github.com/balsm-health/i69n
      ref: master
  flutter_svg: ^2.0.10+1
  # Exact-artwork hit testing on the body map (see widgets/body_hit_map.dart).
  # Both are already in the tree via flutter_svg; declared because we import them.
  path_parsing: ^1.1.0
  xml: ^6.6.1
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  sensors_plus: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  # Used by repo-root test/ suites (golden, phi_leak_fuzz) run via the app package.
  golden_toolkit: ^0.15.0
  flutter_lints: ^4.0.0
  yaml: ^3.1.2
  build_runner: ^2.4.13
dependency_overrides:
  # path_provider_foundation 2.6.0 migrated to package:objective_c + the
  # experimental native-assets build, which mislinks on iOS (Foundation not
  # linked → "Couldn't resolve OBJC_CLASS_$_NSArray ... symbol not found").
  # Pin to the last method-channel build to sidestep native assets.
  path_provider_foundation: 2.4.1
# sqlite3 3.x defaults to bundling a precompiled sqlite3.framework via Dart
# hooks. Flutter's native-assets copy step shares `build/native_assets/ios`
# across iphoneos and iphonesimulator, so a device build's framework gets
# embedded into the next simulator run (dlopen: have 'iOS', need
# 'iOS-simulator'). Look up SQLCipher already linked by sqlcipher_flutter_libs
# instead of shipping a second sqlite3.
hooks:
  user_defines:
    sqlite3:
      source: process
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/body/
    - assets/brand/
  # Self-hosted brand type, copied from the design system's own `fonts/`.
  # The DS ships these deliberately: "offline-default is value #1 … nothing in
  # the type stack touches the network at runtime". Fetching them from Google
  # at runtime (the previous `google_fonts` setup) broke that promise — a
  # signal-less pharmacy fell back to system glyphs. All SIL OFL 1.1.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-VariableFont_wdth_wght.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
