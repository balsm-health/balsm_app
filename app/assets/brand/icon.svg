<svg xmlns="http://www.w3.org/2000/svg" viewBox="18.24 11.42 712.52 683.39" width="712.52" height="683.39" role="img" aria-labelledby="balsm-title balsm-desc">
<title id="balsm-title">بلسم · Balsm</title>
<desc id="balsm-desc">Five identical ribbons joined in a symmetric ring, representing five figures with linked arms in care and solidarity.</desc>
<!-- BALSM MARK. Five identical ribbons joined in a ring, each with a round head, read
     as five figures with linked arms. Everything needed to understand, edit or reuse this
     mark is written here; no other file has to be opened to work on it.

     STRUCTURE. #ribbon is one closed path (14 cubics) and #head one circle. Every arm is a
     <use> of those two, turned by rotate(72k 374.5 383) for k = 0..4, so the five-fold
     symmetry is structural: there is nothing to keep in step by hand, and a silhouette
     turned 72, 144, 216 or 288 degrees about (374.5 383) lands on itself exactly. The mark
     is chiral, so it has no mirror symmetry, by design. Inside the one path the seam is
     symmetric too: the trailing wedge is written as the exact rotation of the leading cap
     and they agree to 5e-7, the limit of the 6-decimal coordinates. The path closes exactly
     and the ink box is centred on x = 374.5 to within 1e-4. The ids are short and plain:
     ribbon, head, ring, heads, the gradients, and balsm-title / balsm-desc, which the root's
     aria-labelledby names for screen readers. Inline the mark at most once per document,
     and prefix its ids if it must sit beside another inline SVG that defines the same
     names, or its fills will resolve to the wrong gradients.

     FRAME. The viewBox IS the ink box: 18.24 11.42, 712.52 wide x 683.39 high, aspect
     1.0426, rounded outward to 0.01. No padding on any side; the five heads set all four
     edges. The ring turns about (374.5 383), which is 29.88 BELOW the centre of that box,
     because the top head alone sets the top edge while the two lower heads sit closer to
     the horizontal. The circle enclosing the whole mark about the turning centre has
     radius 371.570.

     Rules for placing it in a frame. Centre the ink box, and the padding is equal on each
     axis. A head-up five-fold mark is always wider than tall, so in a SQUARE frame each
     vertical margin exceeds each horizontal one by (712.52 - 683.39) / 2 = 14.57 units;
     only turning the mark 9.00 degrees equalises all four, and that tilts the heads. Do not
     centre on the turning centre instead: it buys a squarer look and costs the top head its
     clearance. Under a CIRCULAR mask the enclosing circle must fit, which holds while the
     mark's width is at most 0.887 of the frame, so pad circular exports.

     JOINS AND SEAMS. Where two arms abut, the outline crosses from one copy to the next at
     two points:
       outer join, at (251.822 129.569) = rotate(72) of (577.618 188.012): the outer edges
         meet tangent-continuous here, so the ring reads as one unbroken band;
       inner join, at (240.141 220.338) = rotate(72) of (487.682 204.952): the corner of
         the star-shaped void, where one arm's inner edge passes under the next. This corner
         is deliberate: the two edges meet at 66 degrees.
     The 14 cubics run: 1 leading cap (the seam), 5 inner edge, 1 trailing wedge (the same
     seam, rotated), 7 outer edge. Every junction between edge cubics is exactly G1, the
     outer join included. Nothing is stroked and nothing is clipped.

     SEAM CURVE. The cap was traced from the raster master this mark comes from, then
     refitted as a single cubic with a convex control polygon, so its curvature is
     single-signed: the trace had an inflection about 30 units before the inner join, a
     slight hook. Its end tangents are the trace's. At the outer join it leaves the outer
     edge at a shallow 17.15-degree wedge tip; at the inner join it is tangent to the inner
     edge AND matches its curvature, so the wedge tapers out without a break.

     HEADS. One circle, r 58.65, centre 312.92 from the turning centre. The raster master
     measures r 60.8 at centre 310.2 in these same units, so this is very close to it. What
     the placement buys is the gap between a head and the shoulder below it: 22.88 units
     here against the master's 23.15. An earlier version had the head 3.57 units further in,
     closing that gap to 19.58, which read crowded. Note the trade: move a head OUT to open
     the gap, do not shrink it, because at a given gap a smaller head reads as a dot rather
     than a figure. #head-axis is centred on the circle and travels with it; at 126.358 long
     against the 117.30 diameter, the head spans the middle 0.036 to 0.964 of that ramp, so
     neither end of the head's shading reaches its stop colours.

     COLOUR. Five hues, clockwise from the top: aqua, blue, emerald, violet, mint. The five
     gradient-<hue> fills inherit one #ribbon-axis, which is in userSpaceOnUse on the
     unrotated frame; the rotate lives on each <use>, so the paint turns with its arm and
     all five get the identical ramp. They share one OKLab lightness profile: deep at the
     leading seam, light at the trailing seam, clockwise, the same depth on every arm,
     smoothed so the largest slope jump is 0.12. The profile's zero sits at offset 0.435 and
     that stop is the hue's base value; the ramp runs 600 -> base -> light. Each head-<hue>
     is one shared lightness step either side of its arm's base value, along #head-axis.
     Every fill is written as the gradient url followed by the hue's base value, the SVG
     paint-fallback form, so if the gradient cannot be resolved (defs stripped by a
     sanitiser, an id clash) the shape renders in its flat brand hue rather than black.

     EDITING. This file is the source for both the geometry and the colour, and copies of
     both are generated from it into other assets and components. So:
       - Change a hex HERE and regenerate; never edit a generated copy, or it silently
         drifts, which is what happened before 2026-09.
       - Keep the stop at offset 0.435 equal to the hue token of the same name in the
         design system, since that stop is what generated copies read.
       - If the geometry moves, recompute the viewBox as the new ink box and every figure
         quoted above, because consumers hard-code this box to lay the mark out.
       - Keep the wedge an exact rotation of the cap, or the seams stop coinciding and the
         ring shows a hairline where two arms meet. -->
