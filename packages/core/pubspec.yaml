name: core
description: Balsm shared kernel
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.0.0
  drift: ^2.29.0
  # SQLCipher provides the sqlite3 native libs WITH encryption — do not also
  # depend on sqlite3_flutter_libs (duplicate Sqlite3FlutterLibsPlugin class).
  # The app pubspec sets sqlite3 hooks `source: process` so Dart does not also
  # embed native-assets sqlite3.framework (device/sim mixup on iOS).
  sqlcipher_flutter_libs: ^0.5.4
  dio: ^5.8.0
  balsm_api:
    path: ../balsm_api
  google_sign_in: ^6.2.0
  http: ^1.2.0
  sign_in_with_apple: ^6.1.0
  sentry_flutter: ^9.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  permission_handler: ^11.3.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  # Plaintext KV backend for GlobalKVDataSource (flags/UI prefs only — never
  # PHI or secrets). See src/data_source/impl/shared_prefs_kv_data_source.dart.
  shared_preferences: ^2.3.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  # RFC 9562 UUIDv7 generation (time-ordered, web-safe, monotonic within a ms).
  # UuidV7 wraps this — see src/domain/value_objects/uuid_v7.dart.
  uuid: ^4.5.3
  intl: ^0.20.0
  app_links: ^6.3.0
  url_launcher: ^6.3.0
  url_strategy: ^0.3.0
  flutter_svg: ^2.0.10+1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  cryptography: ^2.7.0
  lucide_icons: ^0.257.0
  # Typed i18n + remote runtime translation. Fork adds the `remote-source`
  # runtime (`i69n.load`/`tr`) — remote value → compiled default → key.
  i69n:
    git:
      url: https://github.com/balsm-health/i69n
      ref: master

dev_dependencies:
  custom_lint: ^0.8.0
  balsm_boundary_lint:
    path: ../balsm_boundary_lint
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.29.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

flutter:
  assets:
    - assets/brand/
