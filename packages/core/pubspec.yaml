name: core
description: Balsm shared kernel
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.0.0
  drift: ^2.29.0
  # SQLCipher provides the sqlite3 native libs WITH encryption — do not also
  # depend on sqlite3_flutter_libs (duplicate Sqlite3FlutterLibsPlugin class).
  sqlcipher_flutter_libs: ^0.5.4
  dio: ^5.8.0
  google_sign_in: ^6.2.0
  http: ^1.2.0
  sign_in_with_apple: ^6.1.0
  sentry_flutter: ^9.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  permission_handler: ^11.3.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.0
  app_links: ^6.3.0
  url_strategy: ^0.3.0
  flutter_svg: ^2.0.10+1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  cryptography: ^2.7.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.29.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

flutter:
  assets:
    - assets/i18n/
    - assets/brand/
