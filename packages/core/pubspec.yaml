name: core
description: Balsm shared kernel
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  app_links: ^7.2.2
  balsm_api:
    path: ../balsm_api
  collection: ^1.19.0
  connectivity_plus: ^7.3.2
  cryptography: ^2.7.0
  # SQLCipher itself comes from package:sqlite3's build hook (app/pubspec.yaml
  # `hooks: user_defines: sqlite3: source: sqlcipher`), not from a Flutter
  # plugin. Do not add sqlcipher_flutter_libs / sqlite3_flutter_libs back: since
  # sqlite3 3.x they are obsolete and would ship a second SQLite copy.
  dio: ^5.8.0
  drift: ^2.31.0
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  flutter_secure_storage_platform_interface: any
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^3.0.0
  go_router: ^18.1.4
  golden_toolkit: any
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  googleapis_auth: ^2.3.7
  http: ^1.2.0
  # Typed i18n + remote runtime translation. Fork adds the `remote-source`
  # runtime (`i69n.load`/`tr`) — remote value → compiled default → key.
  i69n:
    git:
      url: https://github.com/balsm-health/i69n
      ref: master
  intl: ^0.20.0
  json_annotation: ^4.9.0
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.2.0

  meta: any
  # Installed version, for the app-update check.
  package_info_plus: ^10.2.2
  path_provider: any
  permission_handler: ^13.0.2  # Product analytics (behaviour, funnels, campaign attribution). Reached only
  # through the AnalyticsLogger facade in src/telemetry — see
  # posthog_analytics_logger.dart. Manual init (AUTO_INIT: false on both native
  # sides) so the patient's consent is read before the SDK ever starts.
  # Held at <=5.50.7: from 5.50.15 showSurvey waits for a navigator context, so
  # ChoiceOnlySurveyPlatform's super.showSurvey hangs (survey_guard_test times out).
  # Lift once the guard is adapted to the new survey flow.
  posthog_flutter: '>=5.50.0 <5.50.8'
  riverpod: any
  sentry_flutter: ^10.6.0  # Plaintext KV backend for GlobalKVDataSource (flags/UI prefs only — never
  # PHI or secrets). See src/data_source/impl/shared_prefs_kv_data_source.dart.
  shared_preferences: ^2.3.0
  sign_in_with_apple: ^8.2.0
  # Web only: WasmSqlite3 + IndexedDbFileSystem for database_connection_web.dart.
  sqlite3: any
  timezone: ^0.11.2
  url_launcher: ^6.3.0
  url_strategy: ^0.3.0
  # RFC 9562 UUIDv7 generation (time-ordered, web-safe, monotonic within a ms).
  # UuidV7 wraps this — see src/domain/value_objects/uuid_v7.dart.
  uuid: ^4.5.3
  # Web only: IndexedDB / WebCrypto / Web Locks bindings.
  web: ^1.1.0
dev_dependencies:
  balsm_boundary_lint:
    path: ../balsm_boundary_lint
  balsm_lints:
    path: ../balsm_lints
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  # Held: drift_dev 2.32+ needs analyzer >=10, but custom_lint (balsm_boundary_lint) caps analyzer <9.
  drift_dev: '>=2.29.0 <2.32.0'
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  assets:
    - assets/brand/
