name: balsm_app

packages:
  - packages/*
  - modules/*
  - app

scripts:
  gen:
    run: melos exec --concurrency=6 -- "dart run build_runner build --delete-conflicting-outputs"
  analyze:
    run: melos exec --concurrency=6 -- "flutter analyze --no-fatal-infos"
  # DDD boundary rules (balsm_boundary_lint via custom_lint). Runs per package;
  # surfaces module→module imports, barrel-leak, aggregate-leak, etc.
  boundaries:
    run: melos exec --concurrency=4 --ignore=app -- "dart run custom_lint"
  test:
    run: melos exec --concurrency=4 -- "flutter test"
  e2e:
    run: melos exec --scope=app -- "flutter test integration_test"
  # run/build wiring lives in scripts/flutter.sh (single source of truth,
  # shared with VS Code tasks + CI). Args: <action> <brand> <env>.
  run:dev:
    run: scripts/flutter.sh run balsm dev
  run:patient:
    run: scripts/flutter.sh run balsm dev
  run:staging:
    run: scripts/flutter.sh run balsm staging
  run:prod:
    run: scripts/flutter.sh run balsm prod
  build:android:dev:
    run: scripts/flutter.sh apk balsm dev
  build:android:staging:
    run: scripts/flutter.sh apk balsm staging
  build:android:prod:
    run: scripts/flutter.sh apk balsm prod
  build:web:dev:
    run: scripts/flutter.sh web balsm dev
  build:web:prod:
    run: scripts/flutter.sh web balsm prod
