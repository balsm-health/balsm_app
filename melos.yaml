name: balsm_app

packages:
  - packages/*
  - modules/*
  - app

scripts:
  gen:
    run: melos exec --concurrency=6 -- "dart run build_runner build --delete-conflicting-outputs"
  analyze:
    run: melos exec --concurrency=6 -- "flutter analyze --no-fatal-infos"
  # DDD boundary rules (balsm_boundary_lint via custom_lint). Runs per package;
  # surfaces module→module imports, barrel-leak, aggregate-leak, etc.
  boundaries:
    run: melos exec --concurrency=4 --ignore=app -- "dart run custom_lint"
  test:
    run: melos exec --concurrency=4 -- "flutter test"
  e2e:
    run: melos exec --scope=app -- "flutter test integration_test"
  run:dev:
    run: flutter run -t lib/main_patient.dart --flavor dev --dart-define-from-file=env/balsm/dev.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  run:patient:
    run: flutter run -t lib/main_patient.dart --flavor dev --dart-define-from-file=env/balsm/dev.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  run:staging:
    run: flutter run -t lib/main_patient.dart --flavor staging --dart-define-from-file=env/balsm/staging.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  run:prod:
    run: flutter run -t lib/main_patient.dart --flavor prod --dart-define-from-file=env/balsm/prod.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  build:android:dev:
    run: flutter build apk --flavor dev -t lib/main_patient.dart --dart-define-from-file=env/balsm/dev.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  build:android:staging:
    run: flutter build apk --flavor staging -t lib/main_patient.dart --dart-define-from-file=env/balsm/staging.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  build:android:prod:
    run: flutter build apk --flavor prod -t lib/main_patient.dart --dart-define-from-file=env/balsm/prod.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  build:web:dev:
    run: flutter build web --flavor dev -t lib/main_patient.dart --dart-define-from-file=env/balsm/dev.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
  build:web:prod:
    run: flutter build web --flavor prod -t lib/main_patient.dart --dart-define-from-file=env/balsm/prod.json --dart-define-from-file=env/envs.json
    exec:
      scope: app
